# Deploys the backend to Cloudflare (Worker + Container).
#
# Runs on every push to main and on demand.
# A deploy restarts the container, which kills any job still in progress.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Containers:Edit permissions) and CLOUDFLARE_ACCOUNT_ID. App secrets are set
# once with `wrangler secret put` (see cloudflare/wrangler.jsonc) and persist
# across deploys.

name: Cloudflare Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    concurrency: cloudflare-deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: cloudflare
      - run: npx wrangler deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
